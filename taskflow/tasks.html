<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Công việc - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header"><div class="container nav">
    <a class="brand" href="index.html"><span>✓</span> TaskFlow</a>
    <button class="nav-toggle" aria-label="Mở menu">☰</button>
    <nav class="nav-links"><a href="../index.html">Trang chính</a><a href="index.html">Trang chủ</a><a class="active" href="tasks.html">Công việc</a><a href="about.html">Giới thiệu</a><a href="contact.html">Liên hệ</a><span class="auth-links"></span></nav>
  </div></header>

  <main class="page-shell">
    <div class="container">
      <div class="page-title"><div><span>Không gian làm việc</span><h1>Danh sách công việc</h1></div><button class="btn btn-primary" id="openTaskModal">+ Thêm công việc</button></div>
      <div class="task-toolbar">
        <label class="search-box">⌕ <input id="searchInput" type="search" placeholder="Tìm công việc..."></label>
        <div class="filters"><button class="filter active" data-filter="all">Tất cả</button><button class="filter" data-filter="todo">Chưa làm</button><button class="filter" data-filter="doing">Đang làm</button><button class="filter" data-filter="done">Hoàn thành</button></div>
      </div>
      <div class="task-list" id="taskList"></div>
    </div>
  </main>

  <div class="modal" id="taskModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" type="button">×</button>
      <h2 id="modalTitle">Thêm công việc</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <label>Tên công việc<input id="taskName" required maxlength="80" placeholder="Ví dụ: Hoàn thành đồ án"></label>
        <label>Mô tả<textarea id="taskDescription" rows="3" maxlength="240" placeholder="Ghi chú ngắn..."></textarea></label>
        <div class="form-grid"><label>Ngày hạn<input id="taskDue" type="date" required></label><label>Trạng thái<select id="taskStatus"><option value="todo">Chưa làm</option><option value="doing">Đang làm</option><option value="done">Hoàn thành</option></select></label></div>
        <label>Ưu tiên<select id="taskPriority"><option value="low">Thấp</option><option value="medium" selected>Trung bình</option><option value="high">Cao</option></select></label>
        <button class="btn btn-primary full" type="submit">Lưu công việc</button>
      </form>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="js/main.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
