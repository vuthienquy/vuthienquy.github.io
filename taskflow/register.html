<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký - TaskFlow</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body class="auth-body">
  <main class="auth-layout"><a class="brand auth-brand" href="index.html"><span>✓</span> TaskFlow</a><form class="auth-card" id="registerForm"><span class="eyebrow">Tạo tài khoản</span><h1>Bắt đầu cùng TaskFlow</h1><label>Họ và tên<input id="regName" required minlength="2" placeholder="Nguyễn Văn A"></label><label>Email<input id="regEmail" type="email" required placeholder="email@example.com"></label><label>Mật khẩu<input id="regPassword" type="password" required minlength="6" placeholder="Tối thiểu 6 ký tự"></label><label>Xác nhận mật khẩu<input id="regConfirm" type="password" required placeholder="Nhập lại mật khẩu"></label><button class="btn btn-primary full" type="submit">Đăng ký</button><p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p></form></main><div id="toast" class="toast"></div>
  <script src="js/main.js"></script><script src="js/auth.js"></script>
</body>
</html>
